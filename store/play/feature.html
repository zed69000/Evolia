<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Bannière Google Play (1024 x 500). Rendu : ouvrir feature.html à 1024 x 500 et l'enregistrer (voir fiche.md). -->
<link href="https://fonts.googleapis.com/css2?family=Courgette&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root { --papier: #FDF7E7; --foret: #1F6B47; --elan: #F08A3C; --doux: #5A6B4E; }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: var(--papier); font-family: Nunito, sans-serif; }
.bg { position: absolute; inset: 0;
	background: radial-gradient(circle 300px at 8% 10%, rgba(244,194,62,.30), transparent 70%),
		radial-gradient(circle 360px at 30% 110%, rgba(163,189,87,.35), transparent 70%), var(--papier); }
.logo { position: absolute; left: 56px; top: 64px; width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 10px 30px rgba(40,60,30,.18); }
.title { position: absolute; left: 56px; top: 236px; font: 400 92px/1 Courgette, cursive; color: var(--foret); }
.tag { position: absolute; left: 60px; top: 352px; width: 440px; font: 800 28px/1.3 Nunito, sans-serif; color: var(--doux); }
.tag b { color: var(--elan); }
.view { position: absolute; right: 40px; top: 36px; width: 430px; height: 428px; border-radius: 40px; overflow: hidden; transform: rotate(3deg);
	box-shadow: 0 0 0 10px #FFFFFF, 0 0 0 13px #E4DCC4, 0 24px 50px rgba(40,60,30,.25); }
.view img { position: absolute; width: 100%; top: -12%; }
</style>
</head>
<body>
<div class="bg"></div>
<img class="logo" src="../../public/assets/icon-512.png" alt="">
<div class="title">Evolia</div>
<div class="tag">Marche, et regarde ton <b>jardin</b> s’éveiller.</div>
<div class="view"><img src="raw/7-jardin.png" alt=""></div>
</body>
</html>
