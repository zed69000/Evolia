<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FDF7E7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evolia">
<title>Evolia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courgette&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
	<canvas id="garden" aria-label="Ton jardin"></canvas>
	<div id="splash" aria-hidden="true"><img src="assets/logo.png" alt=""></div>

	<header id="hud" class="card">
		<img src="assets/logo.png" alt="Evolia" class="hud-logo">
		<div class="hud-text">
			<div class="hud-title" id="hud-day">Jour 1</div>
			<div class="hud-sub"><b id="hud-km">0 / 3 km</b> · <span id="hud-steps"></span></div>
		</div>
		<svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
			<circle class="ring-bg" cx="22" cy="22" r="18"/>
			<circle class="ring-fg" id="ring-fg" cx="22" cy="22" r="18"/>
		</svg>
	</header>

	<button id="quest" class="quest card" hidden>
		<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
		<span>Trouve : <b id="quest-name"></b></span>
	</button>
	<button id="daily" class="daily-chip card" aria-label="Défis du jour">
		<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3 9h18M12 9v11M12 9c-2-4-6-4-6-1.5S10 9 12 9Zm0 0c2-4 6-4 6-1.5S14 9 12 9Z"/></svg>
		<span id="daily-count">0 / 3</span><i class="dot-new" id="daily-dot" hidden></i>
	</button>
	<div id="toasts" aria-live="polite"></div>
	<div id="plant-card" class="card bubble" hidden></div>

	<section id="home" class="sheet card">
		<div id="live" class="live" hidden>
			<div class="walk-stats">
				<div><b id="live-km">0,00</b><span>km</span></div>
				<div><b id="live-time">0:00</b><span>durée</span></div>
				<div><b id="live-speed">0,0</b><span>km/h</span></div>
				<div><b id="live-steps">0</b><span>pas</span></div>
			</div>
			<div class="growing">
				<div class="growing-row"><span id="grow-name">Ta prochaine plante</span><span id="grow-pct"></span></div>
				<div class="bar"><i id="grow-bar"></i></div>
			</div>
		</div>
		<button id="next-goal" class="next-goal" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span id="next-goal-text"></span></button>
		<div class="status-row">
			<div class="status">
				<i class="status-dot" id="status-dot"></i>
				<div class="status-text"><b id="status-title">Au repos</b><span id="status-sub"></span></div>
			</div>
			<button id="btn-eco" class="btn round" aria-label="Écosystème">
				<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 4v8l-7 4-7-4V7z"/><path d="M12 8l3.5 2v4L12 16l-3.5-2v-4z"/></svg>
			</button>
			<button id="btn-species" class="btn round" aria-label="Biodiversité">
				<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4 0-7-3-7-7 0-5 4-8 7-9 3 1 7 4 7 9 0 4-3 7-7 7Z"/><path d="M12 20V9"/><path d="M12 14l-3-2.5M12 12l3-2.5"/></svg>
				<i class="dot-new" id="species-dot" hidden></i>
			</button>
			<button id="btn-journal" class="btn round" aria-label="Ouvrir le carnet">
				<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5"/><path d="M19 17v4H6.5"/><path d="M12 7c-2 0-3 1.5-3 3 2 0 3-1.2 3-3Zm0 0c2 0 3 1.5 3 3-2 0-3-1.2-3-3Zm0 0v6"/></svg>
			</button>
		</div>
		<button id="btn-track" class="btn primary wide-btn" hidden>Activer le suivi de mes pas</button>
	</section>

	<div id="coach" class="coach" hidden><div class="coach-card card"></div></div>

	<div id="modal" class="modal" hidden><div class="card modal-card" id="modal-card"></div></div>

	<section id="journal" class="panel" aria-hidden="true"></section>
	<section id="species" class="panel" aria-hidden="true"></section>
	<section id="map" class="panel" aria-hidden="true"></section>
	<section id="eco" class="panel" aria-hidden="true"></section>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
