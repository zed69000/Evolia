# Fabrique l'apk de test Android sur les machines gratuites de GitHub, sans clé ni secret.
# Il vérifie que l'appli se construit, et donne un fichier à installer directement sur un téléphone.
# Se lance à chaque push sur master qui touche l'appli, ou à la main : Actions > « Android · apk de test » > Run workflow.
# L'apk se télécharge en bas de la page du build, dans « Artifacts ».
name: Android · apk de test

on:
  push:
    branches: [master]
    paths: [public/**, tools/app/**, package.json, capacitor.config.json, .github/workflows/android-apk.yml]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Copie du jardin dans www (polices embarquées)
        run: npm run build:web
      - name: Projet Android
        run: |
          npx cap add android
          npm run native:android
          npx cap sync android
      - name: Compilation de l'apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: evolia-apk
          path: android/app/build/outputs/apk/debug/*.apk
